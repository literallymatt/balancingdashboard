name: Android APK

on:
  push:
    branches: [main]
    paths: ['android/**', 'bmdash/static/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.14.3' }
      - name: Build release APK
        run: gradle -p android :app:assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: bmdash-apk
          path: android/app/build/outputs/apk/release/app-release.apk
      # A stable download link for installing on the phone:
      # https://github.com/<owner>/<repo>/releases/download/android-latest/bmdash.apk
      - name: Publish to the android-latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk bmdash.apk
          gh release view android-latest >/dev/null 2>&1 || gh release create android-latest \
            --title "Android app (latest build)" --notes "Sideloadable debug-signed APK, rebuilt from main."
          gh release upload android-latest bmdash.apk --clobber
