<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GB Balancing Mechanism</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="top">
  <div class="brand">GB Balancing Mechanism</div>
  <nav id="nav">
    <a href="#/overview" data-view="overview" title="Overview: system-wide BM costs over time, by technology and party">Overview</a>
    <a href="#/units" data-view="units" title="Units: every BM unit with accepted actions, ranked by cost">Units</a>
    <a href="#/costs" data-view="costs" title="Costs: total balancing costs by month, by source or purpose">Costs</a>
    <a href="#/constraints" data-view="constraints" title="Constraints: boundary flows against their limits, and constraint costs">Constraints</a>
    <a href="#/data" data-view="data" title="Data: what is held and fetch more from Elexon">Data</a>
  </nav>
  <div class="spacer"></div>
  <div id="coverage" class="muted small"></div>
  <button type="button" id="dbgBtn" class="btn small" title="Open the debug panel: CPU, heat and data use">Debug</button>
</header>

<div class="filters" id="filterbar">
  <div class="seg" id="presets"></div>
  <label class="small muted">From <input type="date" id="from"></label>
  <label class="small muted">To <input type="date" id="to"></label>
  <label class="small muted">Granularity
    <select id="bucket">
      <option value="auto">Auto</option>
      <option value="sp">Settlement period</option>
      <option value="hour">Hour</option>
      <option value="day">Day</option>
      <option value="week">Week</option>
      <option value="month">Month</option>
      <option value="tod">Time-of-day profile</option>
    </select><button type="button" class="info" data-tip="gran" aria-label="What does Granularity mean?" title="Click for what Granularity means">i</button>
  </label>
  <div id="chips"></div>
</div>

<main id="main"></main>
<div id="tooltip-root"></div>

<script src="/static/vendor/echarts.min.js"></script>
<script type="module" src="/static/app.js"></script>
</body>
</html>
